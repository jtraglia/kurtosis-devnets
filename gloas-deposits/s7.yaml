# Scenario 7: Builder deposit to an already-onboarded validator.
# Drives ONE pubkey through three stages: 50k invalid 0x01 validator deposits
# (burned), then 1 valid 0x01 validator deposit that onboards the pubkey as a
# regular validator, then 1 valid 0x03 builder deposit for that same pubkey.
# Because the pubkey is already a validator by then, the builder deposit should
# be treated as a balance top-up (signature skipped, credentials ignored) — it
# should NOT convert the validator into a builder.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3-deposits
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 250000000
  genesis_gaslimit: 250000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: jtraglia/assertoor
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/jtraglia/assertoor/refs/heads/master/playbooks/gloas-dev/deposits/s7.yaml"
      config:
        invalidValidatorDeposits: 50000
        batchSize: 220
        pendingBatches: 32
        perSlot: 8192
        depositAmount: 1
        skipForkActivationCheck: false

dora_params:
  image: ethpandaops/dora:master

# Scenario 1: Sustained bulk builder onboarding.
# Spams valid 0x03 builder deposits with unique pubkeys at a high rate
# (~8192 deposits per block, roughly 200M gas/slot) and keeps it up
# indefinitely. Every deposit onboards a new builder, so the ETH is recycled
# rather than burned. Verifies clients sustain the deposit throughput and stay
# final. Note: deposit generation takes a few slots to spin up at the start.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3-deposits
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 250000000
  genesis_gaslimit: 250000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: ethpandaops/assertoor:master
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/ethpandaops/assertoor/refs/heads/master/playbooks/gloas-dev/builder-deposit-spam.yaml"
      config:
        batchSize: 220
        pendingBatches: 32 # 8192 deposits per block
        totalDeposits: 1000000
        skipForkActivationCheck: false

dora_params:
  image: ethpandaops/dora:master

# Scenario 4: Invalid validator deposits then a valid builder, in one payload.
# Targets ONE pubkey with 5000 invalid 0x01 validator deposits followed by a
# single valid 0x03 builder deposit (5001 total, under the per-block limit, so
# the whole set aims to land in a single payload). The validator deposits are
# burned as they process; the valid builder deposit onboards the builder for
# that same pubkey.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3-deposits
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 250000000
  genesis_gaslimit: 250000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: jtraglia/assertoor
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/jtraglia/assertoor/refs/heads/master/playbooks/gloas-dev/deposits/s4.yaml"
      config:
        validatorDeposits: 5000
        batchSize: 220
        pendingBatches: 32
        perSlot: 8192
        depositAmount: 1
        skipForkActivationCheck: false

dora_params:
  image: ethpandaops/dora:master

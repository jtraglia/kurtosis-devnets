# Scenario 2: Mass builder onboarding at the fork.
# Spams valid 0x03 builder deposits with unique pubkeys before Gloas activates
# (~2048 per slot), building a large backlog so that ~32k builders are
# onboarded in the first slots after the fork. Stresses signature validation of
# a large batch of valid deposits right at the transition. Note: deposit
# generation takes a few slots to spin up, so start the run well before epoch 1.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: lodestar
      cl_image: tuyennhv/lodestar:te-improve_onboard_builders
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 200000000
  genesis_gaslimit: 200000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: jtraglia/assertoor
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/jtraglia/assertoor/refs/heads/master/playbooks/gloas-dev/builder-deposit-spam.yaml"
      config:
        batchSize: 256
        pendingBatches: 32 # 8192 deposits per block
        totalDeposits: 262144
        skipForkActivationCheck: true

dora_params:
  image: ethpandaops/dora:master

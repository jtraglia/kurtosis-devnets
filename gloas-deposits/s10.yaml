# Scenario 10: Sustained bulk builder onboarding with 1% invalid signatures.
# Like scenario 1, but 1% of the builder deposits carry invalid signatures.
# Spams 0x03 builder deposits with unique pubkeys at a high rate; the invalid
# 1% are burned and cannot be batch-verified with the rest (forcing per-deposit
# signature checks), while the valid remainder onboard builders. Verifies
# clients sustain the mixed valid/invalid load and stay final.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3-deposits
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 250000000
  genesis_gaslimit: 250000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: jtraglia/assertoor
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/jtraglia/assertoor/refs/heads/master/playbooks/gloas-dev/builder-deposit-spam.yaml"
      config:
        batchSize: 220
        pendingBatches: 32 # 8192 deposits per block
        totalDeposits: 1000000
        invalidSigPerc: 1
        skipForkActivationCheck: false

dora_params:
  image: ethpandaops/dora:master

# Scenario 3.1: post-fork same-pubkey invalid validator deposits, then a valid builder.
# A variation of scenario 3 (builder-deposit-same-pubkey-spam): instead of invalid
# 0x03 builder deposits before the fork, this runs entirely POST-GLOAS (starting
# epoch 1) and spams invalid 0x01 VALIDATOR deposits, in this order:
#   1. invalidValidatorDeposits invalid 0x01 deposits, all for ONE pubkey
#   2. one valid 0x03 builder deposit for that same pubkey
# The invalid validator deposits burn as they process; the valid builder deposit
# then onboards the builder for that same pubkey. ETH burned scales with
# invalidValidatorDeposits.
#
# Requires the custom jtraglia/assertoor:reuse-index image. The funding premine
# must cover ~invalidValidatorDeposits ETH (~50k by default).

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3-deposits
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 250000000
  genesis_gaslimit: 250000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: jtraglia/assertoor:reuse-index
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/jtraglia/assertoor/refs/heads/reuse-index/playbooks/gloas-dev/builder-deposit-same-pubkey-validator-spam.yaml"
      config:
        invalidValidatorDeposits: 50000  # invalid 0x01 deposits for one pubkey
        batchSize: 220
        pendingBatches: 32               # ~8192 deposits per block
        perSlot: 8192
        depositAmount: 1
        skipForkActivationCheck: false

dora_params:
  image: ethpandaops/dora:master

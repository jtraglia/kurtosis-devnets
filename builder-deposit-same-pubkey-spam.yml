# Scenario 3: pre-fork pending_deposits queue with same-pubkey builder deposits.
# All submitted in epoch 0, BEFORE the GLOAS fork, in this order:
#   1. invalidBuilderDeposits invalid 0x03 deposits, all for ONE pubkey
#   2. one valid 0x03 deposit for that same pubkey
# At the fork the backlog is processed: invalid same-pubkey deposits burn,
# the valid one onboards the builder. ETH burned scales with invalidBuilderDeposits.
#
# Requires the custom jtraglia/assertoor:reuse-index image. The funding premine
# must cover ~invalidBuilderDeposits ETH (~50k by default).
# Timing is tight: everything must be EL-included before the activation slot.
# With gloas_fork_epoch=1 that is a single epoch — raise it if the fill spills over.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3-deposits
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 250000000
  genesis_gaslimit: 250000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: jtraglia/assertoor:reuse-index
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/jtraglia/assertoor/refs/heads/reuse-index/playbooks/gloas-dev/builder-deposit-same-pubkey-spam.yaml"
      config:
        invalidBuilderDeposits: 50000  # invalid 0x03 deposits for one pubkey
        batchSize: 220
        pendingBatches: 32             # ~8192 deposits per block
        perSlot: 8192
        depositAmount: 1

dora_params:
  image: ethpandaops/dora:master

# Make many 2048 deposits per slot before the Gloas upgrade at epoch 1.
# This should result in many (~32k) builders onboarded at the fork.
# There might be issues validating all of these signatures at the fork.
# Note: deposits will not start immediately, it takes time to generate keys.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: lodestar
      cl_image: tuyennhv/lodestar:te-improve_onboard_builders
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 200000000
  genesis_gaslimit: 200000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: ethpandaops/assertoor:master
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/ethpandaops/assertoor/refs/heads/master/playbooks/gloas-dev/builder-deposit-spam.yaml"
      config:
        batchSize: 256
        pendingBatches: 32 # 8192 deposits per block
        totalDeposits: 262144
        skipForkActivationCheck: true

dora_params:
  image: ethpandaops/dora:master

# Make lots of new builder deposits in Gloas.
# Clients should be able to handle ~200m gas worth of deposits per slot, indefinitely.
# Note it will take several slots to generate the deposits, which are done at initialization.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    #- cl_type: lodestar
    #  cl_image: ethpandaops/lodestar:glamsterdam-devnet-3
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3-deposits
    #- cl_type: teku
    #  cl_image: ethpandaops/teku:glamsterdam-devnet-2
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 1000000000
  genesis_gaslimit: 1000000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: jtraglia/assertoor:invalid-sig-percent
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    #- file: "http://host.docker.internal:8765/assertoor-playbooks/builder-deposits.yml"
    - file: "https://raw.githubusercontent.com/jtraglia/kurtosis-devnets/refs/heads/master/assertoor-playbooks/builder-deposits.yml"
      config:
        totalDeposits: 40960
        perSlot: 8192
        startSlot: 33
        invalidSigPercent: 1

dora_params:
  image: ethpandaops/dora:master

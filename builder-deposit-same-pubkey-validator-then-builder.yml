# Scenario 3.2: post-fork same-pubkey invalid validators -> valid validator -> valid builder.
# A variation of scenario 3.1: runs entirely POST-GLOAS (starting epoch 1) and drives
# ONE pubkey through three stages, in this order:
#   1. invalidValidatorDeposits invalid 0x01 validator deposits (each burned)
#   2. one valid 0x01 validator deposit  -> onboards the pubkey as a validator
#   3. one valid 0x03 builder deposit    -> for the same, now-existing-validator pubkey
# Edge case under test: a deposit for an already-onboarded validator is a balance
# top-up (sig skipped, creds ignored), so stage 3 should NOT convert the validator
# into a builder. Checks the client handles this collision without breaking finality.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:bal-devnet-6
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: prysm
      cl_image: ethpandaops/prysm-beacon-chain:glamsterdam-devnet-3-deposits
  count: 1

network_params:
  gloas_fork_epoch: 1
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 250000000
  genesis_gaslimit: 250000000

additional_services:
  - dora
  - assertoor

assertoor_params:
  image: jtraglia/assertoor:reuse-index
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/jtraglia/assertoor/refs/heads/reuse-index/playbooks/gloas-dev/builder-deposit-same-pubkey-validator-then-builder.yaml"
      config:
        invalidValidatorDeposits: 50000  # invalid 0x01 deposits for one pubkey
        batchSize: 220
        pendingBatches: 32               # ~8192 deposits per block
        perSlot: 8192
        depositAmount: 1
        skipForkActivationCheck: false

dora_params:
  image: ethpandaops/dora:master
